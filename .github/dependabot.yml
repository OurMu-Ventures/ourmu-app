version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      production-dependencies: { dependency-type: production }
      development-dependencies: { dependency-type: development }
    ignore:
      # typescript-eslint, used by eslint-config-next, does not support
      # TypeScript 7 yet: typescript-eslint/typescript-eslint#10940
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

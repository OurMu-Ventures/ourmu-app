name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-publishable-key-000000000
  SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key-0000000000
  IDENTITY_MASTER_KEY_BASE64: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  CRON_SECRET: ci-cron-secret-000000000000000000000000
  RESEND_FROM_EMAIL: OURMU <ci@example.com>
  LEGAL_PRIVACY_VERSION: 2026-09-09
  AGREEMENT_PLACEHOLDER_BLOCK: "true"
jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: 2.113.0 }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --level error
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
